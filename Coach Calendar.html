<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Coach Calendar</title>
<style>
:root{--bg:#f7f7f5;--sf:#fff;--tx:#1c1c1a;--mu:#6b6b66;--bd:#e2e2dc;--ac:#2d5be3;--ok:#1d8a4e;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--sf:#222220;--tx:#eeeeea;--mu:#9a9a94;--bd:#38382f;--ac:#7b9bff;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0 auto 0 0}button,select,input{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx)}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.no{background:var(--no);color:#fff;border-color:var(--no)}
main{padding:12px 14px;max-width:1100px;margin:auto}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.grid{overflow-x:auto}.wk{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:6px;min-width:910px}
.day{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px;min-height:200px}.day h3{font-size:13px;margin:0 0 6px;color:var(--mu)}.day.off{background:repeating-linear-gradient(45deg,var(--sf),var(--sf) 8px,var(--bg) 8px,var(--bg) 16px)}
.ev{border-left:4px solid;border-radius:6px;padding:3px 6px;margin:3px 0;font-size:12px;background:var(--bg)}.ev.pending{opacity:.65;border-style:dashed}.ev.declined{text-decoration:line-through;opacity:.4}
.hol{font-size:12px;color:#b5651d;font-weight:600}.slot{display:block;width:100%;text-align:left;margin:2px 0;font-size:12px;padding:3px 6px;border-style:dashed;color:var(--ac)}
.badge{background:var(--no);color:#fff;border-radius:99px;padding:0 7px;font-size:12px}.panel{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:10px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}small{color:var(--mu)}
</style></head><body>
<header><h1>📅 Coach Calendar</h1><span id="who"></span><button id="bell">🔔 <span id="nb" class="badge" hidden></span></button><button id="exp">⬇ Export .ics</button></header>
<main><div class="bar"><button id="pv">‹</button><button id="td">This week</button><button id="nx">›</button><b id="rng"></b><span style="flex:1"></span><span id="leg"></span></div>
<div id="tools"></div><div id="pan"></div><div class="grid"><div class="wk" id="wk"></div></div>
<p><small>Dashed = pending · faded = declined · hatched day = coach unavailable · orange = Indian national holiday. Hours 9:00–17:00, 1-hour slots.</small></p></main>
<script>
const COL=["#2d5be3","#e67e22","#16a085","#8e44ad","#c0392b","#d4a017","#2c3e50","#e84393"];
const HOL={"2026-01-26":"Republic Day","2026-03-04":"Holi","2026-03-21":"Id-ul-Fitr","2026-03-26":"Ram Navami","2026-03-31":"Mahavir Jayanti","2026-04-03":"Good Friday","2026-05-01":"Buddha Purnima","2026-05-27":"Bakrid","2026-06-26":"Muharram","2026-08-26":"Milad-un-Nabi","2026-09-04":"Janmashtami","2026-10-20":"Dussehra","2026-11-08":"Diwali","2026-11-24":"Guru Nanak Jayanti"};
for(let y=2026;y<=2035;y++){HOL[y+"-01-26"]="Republic Day";HOL[y+"-08-15"]="Independence Day";HOL[y+"-10-02"]="Gandhi Jayanti";HOL[y+"-12-25"]="Christmas"}
const H=[9,10,11,12,13,14,15,16];
const $=id=>document.getElementById(id);const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let db,coach=false,uid="anon",EV=[],TM=[],NT=[],team=null,mon=monday(new Date()),dbOK=false;
function monday(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
const tcol=id=>(TM.find(t=>t.id===id)||{}).color||"#888",tname=id=>(TM.find(t=>t.id===id)||{}).name||"Team";
const hh=h=>String(h).padStart(2,"0")+":00";
try{team=localStorage.getItem("cc_team")}catch(e){}
async function init(){
 const u=await claude.use("user");coach=u?await u.isOwner():false;try{uid=(await u.me()).id||"anon"}catch(e){}
 db=await claude.use("db");if(!db){$("pan").innerHTML='<div class="panel">Sign in to claude.ai to load the shared calendar.</div>';render();return}
 dbOK=true;const sub=(n,f)=>db.collection(n).onSnapshot(s=>{f(s.docs.map(d=>({id:d.id,...d.data()})));render()},e=>console.warn(e));
 sub("events",v=>EV=v);sub("teams",v=>TM=v);sub("notes",v=>NT=v);render()}
const save=(c,id,o)=>db&&db.collection(c).doc(id).set(o);const del=(c,id)=>db&&db.collection(c).doc(id).delete();
const uid8=()=>Math.random().toString(36).slice(2,10);
function notify(to,text){save("notes",uid8(),{to,text,ts:Date.now()})}
function busy(date,h){return EV.some(e=>e.date===date&&(e.type==="unavail"||(e.type==="meeting"&&e.status!=="declined"&&e.start<=h&&h<e.end)))}
function render(){
 const me=coach?"coach":team;$("who").innerHTML=coach?"<b>Coach (admin)</b>":team?'<span class="dot" style="background:'+tcol(team)+'"></span>'+tname(team):"";
 const mine=NT.filter(n=>n.to===me&&n.ts>(+localStorageGet("seen_"+me)||0));$("nb").hidden=!mine.length;$("nb").textContent=mine.length;
 $("leg").innerHTML=TM.map(t=>'<span style="margin-right:8px"><span class="dot" style="background:'+t.color+'"></span>'+esc(t.name)+'</span>').join("");
 tools();
 const ds=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);return d});
 $("rng").textContent=ds[0].toLocaleDateString("en-IN",{day:"numeric",month:"short"})+" – "+ds[6].toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
 $("wk").innerHTML="";ds.forEach(d=>{const k=iso(d),off=EV.some(e=>e.date===k&&e.type==="unavail"),el=document.createElement("div");el.className="day"+(off?" off":"");
  let h='<h3>'+d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric"})+'</h3>';if(HOL[k])h+='<div class="hol">🇮🇳 '+HOL[k]+'</div>';
  EV.filter(e=>e.date===k).sort((a,b)=>(a.start||0)-(b.start||0)).forEach(e=>{
   if(e.type==="unavail"){h+='<div class="ev" style="border-color:#888">⛔ Unavailable'+(coach?' <a href="#" data-u="'+e.id+'">undo</a>':'')+'</div>';return}
   const can=coach||(e.team===team&&e.type==="meeting"),priv=!coach&&e.team!==team;
   h+='<div class="ev '+(e.status||"")+'" style="border-color:'+tcol(e.team)+'"><b>'+(e.type==="deadline"?"⚑ ":"")+(priv?"Booked":esc(e.title||"Meeting"))+'</b>'+(e.type==="meeting"?'<br>'+hh(e.start)+'–'+hh(e.end)+' · '+(priv?"":tname(e.team)+' · ')+e.status:priv?"":'<br>'+tname(e.team));
   if(coach&&e.type==="meeting"&&e.status==="pending")h+='<br><button class="ok" data-a="'+e.id+'">Accept</button> <button class="no" data-d="'+e.id+'">Decline</button>';
   if(coach)h+='<br><a href="#" data-m="'+e.id+'">edit</a> · <a href="#" data-x="'+e.id+'">delete</a>';else if(can)h+='<br><a href="#" data-x="'+e.id+'">cancel</a>';
   h+='</div>'});
  if(!coach&&team&&!off&&!HOL[k]&&k>=iso(new Date()))H.forEach(t=>{if(!busy(k,t))h+='<button class="slot" data-b="'+k+'|'+t+'">+ '+hh(t)+'</button>'});
  el.innerHTML=h;$("wk").appendChild(el)});
}
function localStorageGet(k){try{return localStorage.getItem(k)}catch(e){return 0}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function tools(){let h="";
 if(!coach){h='<div class="row">Booking as: <select id="tsel"><option value="">Select your team…</option>'+TM.map(t=>'<option value="'+t.id+'"'+(t.id===team?" selected":"")+'>'+esc(t.name)+'</option>').join("")+'</select><small>'+(team?"Click a free slot to request a meeting.":"Pick a team to see free slots.")+'</small></div>'}
 else h='<div class="row"><button id="bu">⛔ Mark day unavailable</button><button id="bd">⚑ Add deadline</button><button id="bt">+ Team</button><small>Colours are assigned per team.</small></div>';
 if($("tools").dataset.h!==h){$("tools").innerHTML=h;$("tools").dataset.h=h}}
document.addEventListener("change",e=>{if(e.target.id==="tsel"){team=e.target.value||null;try{localStorage.setItem("cc_team",team||"")}catch(x){}$("tools").dataset.h="";render()}});
document.addEventListener("click",async e=>{const t=e.target,g=a=>t.dataset[a];if(t.tagName==="A")e.preventDefault();
 if(t.id==="pv"||t.id==="nx"||t.id==="td"){mon=t.id==="td"?monday(new Date()):new Date(mon.setDate(mon.getDate()+(t.id==="nx"?7:-7)));render()}
 if(t.id==="bell"){const me=coach?"coach":team,l=NT.filter(n=>n.to===me).sort((a,b)=>b.ts-a.ts).slice(0,15);$("pan").innerHTML='<div class="panel"><b>Notifications</b>'+(l.map(n=>'<div class="row">'+new Date(n.ts).toLocaleString("en-IN")+' — '+esc(n.text)+'</div>').join("")||"<div>None yet</div>")+'</div>';try{localStorage.setItem("seen_"+me,Date.now())}catch(x){}render()}
 if(g("b")&&team){const[d,h]=g("b").split("|"),id=uid8();await save("events",id,{type:"meeting",team,date:d,start:+h,end:+h+1,status:"pending",title:tname(team)+" meeting",by:uid});notify("coach",tname(team)+" requested "+d+" "+hh(+h))}
 if(g("a")||g("d")){const e2=EV.find(x=>x.id===(g("a")||g("d"))),s=g("a")?"approved":"declined";await save("events",e2.id,{...strip(e2),status:s});notify(e2.team,"Your meeting on "+e2.date+" "+hh(e2.start)+" was "+s)}
 if(g("x")){const e2=EV.find(x=>x.id===g("x"));if(!confirm("Delete this entry?"))return;await del("events",e2.id);if(coach&&e2.type==="meeting")notify(e2.team,"Meeting on "+e2.date+" "+hh(e2.start)+" was cancelled by the coach");else if(!coach)notify("coach",tname(e2.team)+" cancelled "+e2.date+" "+hh(e2.start))}
 if(g("u"))await del("events",g("u"));
 if(g("m")){const e2=EV.find(x=>x.id===g("m")),d=prompt("New date (YYYY-MM-DD)",e2.date);if(!d)return;let s=e2.start,en=e2.end;if(e2.type==="meeting"){const h=prompt("New start hour (9-16)",s);if(h===null)return;s=+h;en=s+1}
  await save("events",e2.id,{...strip(e2),date:d,start:s,end:en});if(e2.team)notify(e2.team,"Coach changed '"+(e2.title||"event")+"' from "+e2.date+" to "+d+(e2.type==="meeting"?" "+hh(s):""))}
 if(t.id==="bu"){const d=prompt("Date to block (YYYY-MM-DD)",iso(new Date()));if(!d)return;await save("events",uid8(),{type:"unavail",date:d});
  EV.filter(x=>x.date===d&&x.type==="meeting"&&x.status!=="declined").forEach(x=>{save("events",x.id,{...strip(x),status:"declined"});notify(x.team,"Coach is unavailable on "+d+"; your meeting was declined")})}
 if(t.id==="bd"){if(!TM.length)return alert("Add a team first");const n=prompt("Team (type exact): "+TM.map(x=>x.name).join(", "));const tm=TM.find(x=>x.name===n);if(!tm)return;const d=prompt("Deadline date (YYYY-MM-DD)",iso(new Date())),ti=prompt("Deadline title");if(!d||!ti)return;await save("events",uid8(),{type:"deadline",team:tm.id,date:d,title:ti});notify(tm.id,"New deadline: "+ti+" on "+d)}
 if(t.id==="bt"){const n=prompt("Team name");if(n)await save("teams",uid8(),{name:n,color:COL[TM.length%COL.length]})}
 if(t.id==="exp")exportIcs()});
function strip(e){const{id,...r}=e;return r}
async function exportIcs(){const dl=await claude.use("downloads");if(!dl)return alert("Download unavailable here");const f=s=>s.replace(/-/g,"");const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//CoachCalendar//EN","X-WR-CALNAME:Coach Calendar","X-WR-TIMEZONE:Asia/Kolkata"];
 const add=(id,s,e,sum,allday)=>{L.push("BEGIN:VEVENT","UID:"+id+"@coachcal","DTSTAMP:20260101T000000Z",allday?"DTSTART;VALUE=DATE:"+s:"DTSTART;TZID=Asia/Kolkata:"+s,allday?"DTEND;VALUE=DATE:"+e:"DTEND;TZID=Asia/Kolkata:"+e,"SUMMARY:"+sum.replace(/[,;]/g," "),"END:VEVENT")};
 const nd=d=>{const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+1);return f(iso(x))};
 EV.forEach(e=>{if(e.type==="unavail")add(e.id,f(e.date),nd(e.date),"Coach unavailable",1);else if(e.type==="deadline")add(e.id,f(e.date),nd(e.date),"Deadline: "+e.title+" ("+tname(e.team)+")",1);else if(e.status==="approved")add(e.id,f(e.date)+"T"+String(e.start).padStart(2,"0")+"0000",f(e.date)+"T"+String(e.end).padStart(2,"0")+"0000",e.title)});
 Object.keys(HOL).forEach(d=>add("h"+d,f(d),nd(d),HOL[d],1));L.push("END:VCALENDAR");
 try{await dl.save({filename:"coach-calendar.ics",data:L.join("\r\n")})}catch(e){}}
init();render();
</script></body></html>
